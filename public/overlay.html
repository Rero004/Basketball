<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0" />
  <title>TECNM Basket — Broadcast Overlay (1920x1080)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --home-color: #7A183E;
      --away-color: #1D9BF0;
      --glass-bg: rgba(10, 14, 23, 0.84);
      --glass-border: rgba(255, 255, 255, 0.14);
      --text-primary: #FFFFFF;
      --text-secondary: #94A3B8;
      --accent-gold: #F59E0B;
      --font-display: 'Chakra Petch', 'Inter', system-ui, sans-serif;
      --font-sans: 'Inter', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      font-family: var(--font-sans);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
    }

    /* ==========================================================================
       SCENE TRANSITION ENGINE (Compositor-friendly opacity + individual transforms)
       ========================================================================== */
    .scene-layer {
      position: absolute;
      inset: 0;
      display: flex;
      opacity: 0;
      translate: 0 28px;
      scale: 0.985;
      pointer-events: none;
      visibility: hidden;
      transition:
        opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1),
        translate 0.55s cubic-bezier(0.22, 1, 0.36, 1),
        scale 0.55s cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0.55s;
    }

    .scene-layer.is-active {
      opacity: 1;
      translate: 0 0;
      scale: 1;
      visibility: visible;
    }

    @media (prefers-reduced-motion: reduce) {
      .scene-layer {
        translate: none;
        scale: 1;
        transition-duration: 0.15s;
      }
    }

    /* ==========================================================================
       STATE 1: PAUSE (Center Broadcast Card — Timeouts & Halftime)
       ========================================================================== */
    #scene-pause {
      align-items: center;
      justify-content: center;
    }

    .pause-card {
      position: relative;
      width: 1180px;
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      box-shadow:
        0 32px 80px rgba(0, 0, 0, 0.75),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      overflow: hidden;
      padding: 48px 56px 44px;
    }

    /* Subtle top team color split bar */
    .pause-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--home-color) 0%, var(--home-color) 48%, rgba(255,255,255,0.3) 50%, var(--away-color) 52%, var(--away-color) 100%);
    }

    /* Ambient glow behind teams */
    .pause-glow-home {
      position: absolute;
      top: -120px;
      left: -120px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: var(--home-color);
      filter: blur(110px);
      opacity: 0.35;
      pointer-events: none;
    }

    .pause-glow-away {
      position: absolute;
      bottom: -120px;
      right: -120px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: var(--away-color);
      filter: blur(110px);
      opacity: 0.35;
      pointer-events: none;
    }

    .pause-header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 34px;
    }

    .pause-badge {
      padding: 6px 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #E2E8F0;
    }

    .pause-body {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 36px;
    }

    .pause-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }

    .pause-logo-wrap {
      width: 156px;
      height: 156px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .pause-team.home .pause-logo-wrap {
      border-color: color-mix(in srgb, var(--home-color) 75%, white);
      box-shadow: 0 12px 36px color-mix(in srgb, var(--home-color) 40%, transparent);
    }

    .pause-team.away .pause-logo-wrap {
      border-color: color-mix(in srgb, var(--away-color) 75%, white);
      box-shadow: 0 12px 36px color-mix(in srgb, var(--away-color) 40%, transparent);
    }

    .pause-logo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.45));
    }

    .pause-acronym {
      font-family: var(--font-display);
      font-size: 46px;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1;
      text-transform: uppercase;
    }

    .pause-fullname {
      font-size: 18px;
      font-weight: 600;
      color: #CBD5E1;
      letter-spacing: 0.03em;
      max-width: 300px;
    }

    .pause-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
    }

    .pause-scores {
      display: flex;
      align-items: center;
      gap: 28px;
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 20px 42px;
      border-radius: 22px;
      box-shadow: inset 0 2px 12px rgba(0,0,0,0.6);
    }

    .pause-score-num {
      font-family: var(--font-display);
      font-size: 96px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      min-width: 120px;
      text-align: center;
      text-shadow: 0 6px 24px rgba(0,0,0,0.6);
    }

    .pause-divider {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .pause-vs {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 0.15em;
    }

    .pause-period-pill {
      padding: 6px 18px;
      border-radius: 8px;
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.5);
      color: #FBBF24;
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    /* ==========================================================================
       STATE 2 & 3: LINEUP (lineup_home & lineup_away)
       ========================================================================== */
    #scene-lineup {
      align-items: center;
      justify-content: center;
    }

    .lineup-container {
      position: relative;
      width: 1480px;
      background: var(--glass-bg);
      backdrop-filter: blur(26px) saturate(165%);
      -webkit-backdrop-filter: blur(26px) saturate(165%);
      border-radius: 26px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 36px 90px rgba(0, 0, 0, 0.8);
      padding: 40px 52px 46px;
      overflow: hidden;
      --team-active-color: var(--home-color);
    }

    .lineup-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 7px;
      background: linear-gradient(90deg, var(--team-active-color), color-mix(in srgb, var(--team-active-color) 40%, white));
    }

    .lineup-ambient {
      position: absolute;
      top: -150px;
      right: -100px;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: var(--team-active-color);
      filter: blur(130px);
      opacity: 0.3;
      pointer-events: none;
    }

    .lineup-header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 24px;
      margin-bottom: 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .lineup-team-identity {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .lineup-logo-box {
      width: 84px;
      height: 84px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid var(--team-active-color);
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .lineup-logo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .lineup-titles {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lineup-subtitle {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #CBD5E1;
    }

    .lineup-team-name {
      font-family: var(--font-display);
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      line-height: 1.05;
    }

    .lineup-acronym-tag {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 700;
      padding: 8px 22px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--team-active-color) 35%, rgba(0,0,0,0.6));
      border: 1px solid color-mix(in srgb, var(--team-active-color) 80%, white);
      letter-spacing: 0.1em;
    }

    .lineup-section-label {
      position: relative;
      z-index: 2;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #94A3B8;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lineup-section-label::before {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: var(--team-active-color);
      box-shadow: 0 0 10px var(--team-active-color);
    }

    /* Starters Grid (Top, 5 prominent cards) */
    .starters-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
      margin-bottom: 32px;
    }

    .player-card {
      position: relative;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      overflow: hidden;
      /* MANDATORY identity transform properties to prevent stacking context shift */
      scale: 1;
      translate: 0 0;
      transition:
        scale 0.32s cubic-bezier(0.22, 1, 0.36, 1),
        translate 0.32s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.32s ease,
        background-color 0.32s ease,
        box-shadow 0.32s ease;
    }

    .player-card.starter {
      padding: 24px 20px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.07) 0%, rgba(15, 23, 42, 0.65) 100%);
      border-top: 3px solid var(--team-active-color);
    }

    .player-card.starter .player-number {
      font-family: var(--font-display);
      font-size: 54px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #FFFFFF;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .player-card.starter .player-number::before {
      content: '#';
      font-size: 28px;
      opacity: 0.6;
      margin-right: 2px;
    }

    .player-card.starter .player-name {
      font-size: 20px;
      font-weight: 700;
      color: #F8FAFC;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Bench Grid (Bottom, compact horizontal pills) */
    .bench-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 14px;
    }

    .player-card.bench {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(15, 23, 42, 0.58);
      border-left: 3px solid color-mix(in srgb, var(--team-active-color) 75%, white);
    }

    .player-card.bench .player-number {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 48px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #F1F5F9;
    }

    .player-card.bench .player-name {
      font-size: 17px;
      font-weight: 600;
      color: #E2E8F0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Sequential 1.3s Spotlight Highlight State */
    .player-card.is-highlighted {
      scale: 1.065;
      translate: 0 -5px;
      z-index: 10;
      background: linear-gradient(145deg, color-mix(in srgb, var(--team-active-color) 55%, rgba(15, 23, 42, 0.9)), rgba(15, 23, 42, 0.95));
      border-color: #FFFFFF;
      box-shadow:
        0 0 28px color-mix(in srgb, var(--team-active-color) 90%, white),
        0 14px 34px rgba(0, 0, 0, 0.75),
        inset 0 0 18px rgba(255, 255, 255, 0.28);
    }

    .player-card.is-highlighted .player-number {
      color: #FDE047;
      text-shadow: 0 0 18px rgba(253, 224, 71, 0.65);
    }

    /* ==========================================================================
       STATE 4: SCOREBUG (Bottom-Left Compact Broadcast Scoreboard, 48px margin)
       ========================================================================== */
    #scene-scorebug {
      align-items: flex-end;
      justify-content: flex-start;
      padding: 48px;
    }

    /* Override entry direction for scorebug so it slides nicely from bottom-left */
    #scene-scorebug.scene-layer {
      translate: 0 36px;
      scale: 0.98;
    }

    #scene-scorebug.scene-layer.is-active {
      translate: 0 0;
      scale: 1;
    }

    .scorebug-wrapper {
      position: relative;
      display: flex;
      align-items: stretch;
      height: 76px;
      background: rgba(8, 12, 20, 0.90);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow:
        0 18px 42px rgba(0, 0, 0, 0.68),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      overflow: visible;
    }

    .sb-team {
      position: relative;
      display: flex;
      align-items: center;
      height: 100%;
      padding-right: 16px;
      border-radius: 13px;
      transition: background-color 0.3s ease;
    }

    /* Color stripe */
    .sb-stripe {
      width: 9px;
      height: 100%;
      background: var(--team-color, #7A183E);
      box-shadow: 0 0 12px var(--team-color, #7A183E);
    }

    .sb-team.home .sb-stripe {
      border-top-left-radius: 13px;
      border-bottom-left-radius: 13px;
    }

    .sb-logo-box {
      width: 54px;
      height: 54px;
      margin-left: 12px;
      margin-right: 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sb-logo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
    }

    .sb-acronym {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #F8FAFC;
      min-width: 68px;
      text-transform: uppercase;
    }

    .sb-score-box {
      position: relative;
      min-width: 78px;
      height: 56px;
      margin-left: 8px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      scale: 1;
      transition:
        scale 0.25s cubic-bezier(0.22, 1, 0.36, 1),
        background-color 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
    }

    .sb-score {
      font-family: var(--font-display);
      font-size: 38px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: #FFFFFF;
    }

    .sb-divider {
      width: 1px;
      height: 46px;
      align-self: center;
      background: rgba(255, 255, 255, 0.14);
      margin: 0 4px;
    }

    /* Period Module */
    .sb-period-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 22px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
      border-left: 1px solid rgba(255, 255, 255, 0.14);
      border-top-right-radius: 13px;
      border-bottom-right-radius: 13px;
      min-width: 92px;
    }

    .sb-period-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #94A3B8;
      margin-bottom: 2px;
    }

    .sb-period-val {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      color: #FBBF24;
      letter-spacing: 0.05em;
      line-height: 1;
    }

    /* Score Flash Micro-Animation & Floating +1 / +2 / +3 Badge */
    @keyframes scoreFlashPulse {
      0% {
        scale: 1;
      }
      35% {
        scale: 1.14;
        background-color: var(--team-color, #F59E0B);
        border-color: #FFFFFF;
        box-shadow: 0 0 28px var(--team-color, #F59E0B), inset 0 0 12px rgba(255, 255, 255, 0.6);
      }
      100% {
        scale: 1;
      }
    }

    .sb-score-box.is-flashing {
      animation: scoreFlashPulse 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sb-delta-badge {
      position: absolute;
      top: -44px;
      left: 50%;
      translate: -50% 14px;
      scale: 0.75;
      opacity: 0;
      padding: 4px 14px;
      border-radius: 999px;
      background: var(--team-color, #F59E0B);
      border: 2px solid #FFFFFF;
      color: #FFFFFF;
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), 0 0 18px var(--team-color, #F59E0B);
      pointer-events: none;
      white-space: nowrap;
      z-index: 25;
    }

    @keyframes floatScoreDelta {
      0% {
        opacity: 0;
        translate: -50% 14px;
        scale: 0.75;
      }
      20% {
        opacity: 1;
        translate: -50% -4px;
        scale: 1.12;
      }
      75% {
        opacity: 1;
        translate: -50% -10px;
        scale: 1;
      }
      100% {
        opacity: 0;
        translate: -50% -22px;
        scale: 0.92;
      }
    }

    .sb-delta-badge.is-popping {
      animation: floatScoreDelta 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body>
  <main class="stage">
    <!-- ====================================================================
         SCENE: PAUSE (Centered Broadcast Match Card)
         ==================================================================== -->
    <section id="scene-pause" class="scene-layer" aria-hidden="true">
      <div class="pause-card">
        <div class="pause-glow-home"></div>
        <div class="pause-glow-away"></div>

        <div class="pause-header">
          <span class="pause-badge">TECNM Básquetbol • Marcador Oficial</span>
        </div>

        <div class="pause-body">
          <!-- Home Team -->
          <div class="pause-team home">
            <div class="pause-logo-wrap">
              <img id="pause-home-logo" class="pause-logo" src="/assets/ITSLP/ardilla.png" alt="Logo Local" />
            </div>
            <div id="pause-home-acronym" class="pause-acronym">ITS</div>
            <div id="pause-home-name" class="pause-fullname">ITSLP Ardillas</div>
          </div>

          <!-- Score & Period Center -->
          <div class="pause-center">
            <div class="pause-scores">
              <span id="pause-home-score" class="pause-score-num">0</span>
              <div class="pause-divider">
                <span class="pause-vs">VS</span>
                <span id="pause-period" class="pause-period-pill">1Q</span>
              </div>
              <span id="pause-away-score" class="pause-score-num">0</span>
            </div>
          </div>

          <!-- Away Team -->
          <div class="pause-team away">
            <div class="pause-logo-wrap">
              <img id="pause-away-logo" class="pause-logo" src="/assets/UASLP/Aguila.png" alt="Logo Visitante" />
            </div>
            <div id="pause-away-acronym" class="pause-acronym">UAS</div>
            <div id="pause-away-name" class="pause-fullname">UASLP Águilas</div>
          </div>
        </div>
      </div>
    </section>

    <!-- ====================================================================
         SCENE: LINEUP (Shared dynamic container for lineup_home & lineup_away)
         ==================================================================== -->
    <section id="scene-lineup" class="scene-layer" aria-hidden="true">
      <div id="lineup-card" class="lineup-container">
        <div class="lineup-ambient"></div>

        <header class="lineup-header">
          <div class="lineup-team-identity">
            <div class="lineup-logo-box">
              <img id="lineup-logo" src="/assets/ITSLP/ardilla.png" alt="Team Logo" />
            </div>
            <div class="lineup-titles">
              <span id="lineup-role-label" class="lineup-subtitle">Quinteto Titular y Banca • Local</span>
              <h1 id="lineup-team-name" class="lineup-team-name">ITSLP Ardillas</h1>
            </div>
          </div>
          <div id="lineup-acronym" class="lineup-acronym-tag">ITS</div>
        </header>

        <div class="lineup-section-label">Quinteto Titular</div>
        <div id="lineup-starters" class="starters-grid"></div>

        <div id="lineup-bench-label" class="lineup-section-label">Banca / Suplentes</div>
        <div id="lineup-bench" class="bench-grid"></div>
      </div>
    </section>

    <!-- ====================================================================
         SCENE: SCOREBUG (Bottom-Left 48px Margin Compact Scorebug)
         ==================================================================== -->
    <section id="scene-scorebug" class="scene-layer" aria-hidden="true">
      <div class="scorebug-wrapper">
        <!-- Home Team Segment -->
        <div id="sb-home-team" class="sb-team home">
          <div class="sb-stripe"></div>
          <div class="sb-logo-box">
            <img id="sb-home-logo" class="sb-logo" src="/assets/ITSLP/ardilla.png" alt="Home" />
          </div>
          <span id="sb-home-acronym" class="sb-acronym">ITS</span>
          <div id="sb-home-score-box" class="sb-score-box">
            <span id="sb-home-score" class="sb-score">0</span>
            <div id="sb-home-delta" class="sb-delta-badge">+2</div>
          </div>
        </div>

        <div class="sb-divider"></div>

        <!-- Away Team Segment -->
        <div id="sb-away-team" class="sb-team away">
          <div class="sb-stripe"></div>
          <div class="sb-logo-box">
            <img id="sb-away-logo" class="sb-logo" src="/assets/UASLP/Aguila.png" alt="Away" />
          </div>
          <span id="sb-away-acronym" class="sb-acronym">UAS</span>
          <div id="sb-away-score-box" class="sb-score-box">
            <span id="sb-away-score" class="sb-score">0</span>
            <div id="sb-away-delta" class="sb-delta-badge">+2</div>
          </div>
        </div>

        <!-- Period Segment -->
        <div class="sb-period-box">
          <span class="sb-period-label">Periodo</span>
          <span id="sb-period" class="sb-period-val">1Q</span>
        </div>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let currentState = 'hidden';
    let currentData = null;
    let lineupTimer = null;

    // Scene elements
    const scenePause = document.getElementById('scene-pause');
    const sceneLineup = document.getElementById('scene-lineup');
    const sceneScorebug = document.getElementById('scene-scorebug');

    function clearLineupSpotlight() {
      if (lineupTimer) {
        clearInterval(lineupTimer);
        lineupTimer = null;
      }
      document.querySelectorAll('.player-card.is-highlighted').forEach(el => {
        el.classList.remove('is-highlighted');
      });
    }

    function renderTeamMetadata(data) {
      if (!data) return;
      document.documentElement.style.setProperty('--home-color', data.home.color || '#7A183E');
      document.documentElement.style.setProperty('--away-color', data.away.color || '#1D9BF0');

      const sbHomeTeam = document.getElementById('sb-home-team');
      const sbAwayTeam = document.getElementById('sb-away-team');
      sbHomeTeam.style.setProperty('--team-color', data.home.color || '#7A183E');
      sbAwayTeam.style.setProperty('--team-color', data.away.color || '#1D9BF0');

      // Pause scene bindings
      document.getElementById('pause-home-logo').src = data.home.logo;
      document.getElementById('pause-home-acronym').textContent = data.home.acronym;
      document.getElementById('pause-home-name').textContent = data.home.name;
      document.getElementById('pause-home-score').textContent = data.home.score;

      document.getElementById('pause-away-logo').src = data.away.logo;
      document.getElementById('pause-away-acronym').textContent = data.away.acronym;
      document.getElementById('pause-away-name').textContent = data.away.name;
      document.getElementById('pause-away-score').textContent = data.away.score;
      document.getElementById('pause-period').textContent = data.period;

      // Scorebug scene bindings
      document.getElementById('sb-home-logo').src = data.home.logo;
      document.getElementById('sb-home-acronym').textContent = data.home.acronym;
      document.getElementById('sb-home-score').textContent = data.home.score;

      document.getElementById('sb-away-logo').src = data.away.logo;
      document.getElementById('sb-away-acronym').textContent = data.away.acronym;
      document.getElementById('sb-away-score').textContent = data.away.score;
      document.getElementById('sb-period').textContent = data.period;
    }

    function buildLineupAndRunSpotlight(teamKey) {
      clearLineupSpotlight();
      if (!currentData || !currentData[teamKey]) return;

      const team = currentData[teamKey];
      const isHome = teamKey === 'home';
      const lineupCard = document.getElementById('lineup-card');
      lineupCard.style.setProperty('--team-active-color', team.color || (isHome ? '#7A183E' : '#1D9BF0'));

      document.getElementById('lineup-logo').src = team.logo;
      document.getElementById('lineup-role-label').textContent =
        isHome ? 'Plantilla Oficial • Equipo Local' : 'Plantilla Oficial • Equipo Visitante';
      document.getElementById('lineup-team-name').textContent = team.name;
      document.getElementById('lineup-acronym').textContent = team.acronym;

      const players = Array.isArray(team.players) ? team.players : [];
      const starters = players.filter((p, idx) => p.starter !== undefined ? p.starter : idx < 5);
      const bench = players.filter((p, idx) => p.starter !== undefined ? !p.starter : idx >= 5);

      const startersContainer = document.getElementById('lineup-starters');
      const benchContainer = document.getElementById('lineup-bench');
      const benchLabel = document.getElementById('lineup-bench-label');

      startersContainer.innerHTML = '';
      benchContainer.innerHTML = '';

      starters.forEach((player) => {
        const card = document.createElement('div');
        card.className = 'player-card starter';
        const numSpan = document.createElement('div');
        numSpan.className = 'player-number';
        numSpan.textContent = player.number;
        const nameSpan = document.createElement('div');
        nameSpan.className = 'player-name';
        nameSpan.textContent = player.name;
        card.appendChild(numSpan);
        card.appendChild(nameSpan);
        startersContainer.appendChild(card);
      });

      if (bench.length === 0) {
        benchLabel.style.display = 'none';
        benchContainer.style.display = 'none';
      } else {
        benchLabel.style.display = 'flex';
        benchContainer.style.display = 'grid';
        bench.forEach((player) => {
          const card = document.createElement('div');
          card.className = 'player-card bench';
          const numSpan = document.createElement('div');
          numSpan.className = 'player-number';
          numSpan.textContent = `#${player.number}`;
          const nameSpan = document.createElement('div');
          nameSpan.className = 'player-name';
          nameSpan.textContent = player.name;
          card.appendChild(numSpan);
          card.appendChild(nameSpan);
          benchContainer.appendChild(card);
        });
      }

      // Sequential 1.3s spotlight animation across every player card in order
      const allCards = Array.from(lineupCard.querySelectorAll('.player-card'));
      if (allCards.length === 0) return;

      let activeIdx = 0;

      // Start spotlight slightly after card entrance transition begins
      const highlightNext = () => {
        allCards.forEach(c => c.classList.remove('is-highlighted'));
        if (activeIdx < allCards.length) {
          allCards[activeIdx].classList.add('is-highlighted');
          activeIdx++;
        } else {
          clearInterval(lineupTimer);
          lineupTimer = null;
        }
      };

      highlightNext();
      lineupTimer = setInterval(highlightNext, 1300);
    }

    function applySceneState(newState) {
      currentState = newState;

      scenePause.classList.remove('is-active');
      sceneLineup.classList.remove('is-active');
      sceneScorebug.classList.remove('is-active');

      scenePause.setAttribute('aria-hidden', 'true');
      sceneLineup.setAttribute('aria-hidden', 'true');
      sceneScorebug.setAttribute('aria-hidden', 'true');

      if (newState !== 'lineup_home' && newState !== 'lineup_away') {
        clearLineupSpotlight();
      }

      if (newState === 'pause') {
        scenePause.classList.add('is-active');
        scenePause.setAttribute('aria-hidden', 'false');
      } else if (newState === 'lineup_home') {
        buildLineupAndRunSpotlight('home');
        sceneLineup.classList.add('is-active');
        sceneLineup.setAttribute('aria-hidden', 'false');
      } else if (newState === 'lineup_away') {
        buildLineupAndRunSpotlight('away');
        sceneLineup.classList.add('is-active');
        sceneLineup.setAttribute('aria-hidden', 'false');
      } else if (newState === 'scorebug') {
        sceneScorebug.classList.add('is-active');
        sceneScorebug.setAttribute('aria-hidden', 'false');
      }
      // 'hidden' leaves all scenes inactive -> 100% transparent clean canvas
    }

    function triggerScoreFlash(team, points) {
      const isHome = team === 'home';
      const scoreBox = document.getElementById(isHome ? 'sb-home-score-box' : 'sb-away-score-box');
      const deltaBadge = document.getElementById(isHome ? 'sb-home-delta' : 'sb-away-delta');

      // Re-trigger flash animation
      scoreBox.classList.remove('is-flashing');
      void scoreBox.offsetWidth;
      scoreBox.classList.add('is-flashing');

      // Show +1, +2, or +3 badge when points are added
      if (points > 0) {
        deltaBadge.textContent = `+${points}`;
        deltaBadge.classList.remove('is-popping');
        void deltaBadge.offsetWidth;
        deltaBadge.classList.add('is-popping');
      }
    }

    // Socket events
    socket.on('matchState', (data) => {
      currentData = data;
      renderTeamMetadata(data);
      applySceneState(data.state || 'scorebug');
    });

    socket.on('stateChange', ({ state, matchData }) => {
      if (matchData) {
        currentData = matchData;
        renderTeamMetadata(matchData);
      }
      applySceneState(state);
    });

    socket.on('scoreUpdate', (payload) => {
      if (currentData) {
        currentData.home.score = payload.homeScore;
        currentData.away.score = payload.awayScore;
      }
      document.getElementById('sb-home-score').textContent = payload.homeScore;
      document.getElementById('sb-away-score').textContent = payload.awayScore;
      document.getElementById('pause-home-score').textContent = payload.homeScore;
      document.getElementById('pause-away-score').textContent = payload.awayScore;

      if (payload.actualDelta !== 0) {
        triggerScoreFlash(payload.team, payload.points);
      }
    });

    socket.on('periodUpdate', ({ period, matchData }) => {
      if (matchData) currentData = matchData;
      document.getElementById('sb-period').textContent = period;
      document.getElementById('pause-period').textContent = period;
    });

    socket.on('rostersUpdated', ({ matchData }) => {
      currentData = matchData;
      renderTeamMetadata(matchData);
      if (currentState === 'lineup_home') {
        buildLineupAndRunSpotlight('home');
      } else if (currentState === 'lineup_away') {
        buildLineupAndRunSpotlight('away');
      }
    });

    // Cloud / Vercel Serverless Fallback Polling (keeps OBS overlay perfectly synced)
    setInterval(async () => {
      try {
        const res = await fetch('/api/data');
        if (!res.ok) return;
        const json = await res.json();
        const md = json?.matchData;
        if (!md) return;

        const homeChanged = !currentData || currentData.home?.score !== md.home?.score;
        const awayChanged = !currentData || currentData.away?.score !== md.away?.score;
        const stateChanged = !currentData || currentData.state !== md.state;
        const periodChanged = !currentData || currentData.period !== md.period;

        if (homeChanged && currentData) {
          const delta = md.home.score - currentData.home.score;
          triggerScoreFlash('home', delta);
        }
        if (awayChanged && currentData) {
          const delta = md.away.score - currentData.away.score;
          triggerScoreFlash('away', delta);
        }

        currentData = md;
        renderTeamMetadata(md);

        if (stateChanged && md.state) {
          applySceneState(md.state);
        }
      } catch (err) {
        // Silent catch for intermittent network drops
      }
    }, 1000);
  </script>
</body>
</html>
